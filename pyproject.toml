[project]
name = "sap-o2c-assistant"
version = "0.1.0"
description = "Chat assistant and dashboard for SAP Order-to-Cash data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.14.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.50",
    "torch>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/o2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# On Linux (Docker, GitHub Actions) take the small CPU build of PyTorch, not the 2 GB CUDA one.
# On macOS uv uses the normal PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
