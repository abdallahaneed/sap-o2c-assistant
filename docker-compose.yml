# Start everything with: docker compose up --build
# Dashboard and data: http://localhost:8501   API docs: http://localhost:8000/docs
# Works without any key (mock mode from fixtures). The chat needs Ollama running on the host.

services:
  api:
    build: .
    command: ["uvicorn", "o2c.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false  # no .env: mock mode, chat via Ollama on the host
    environment:
      # The model runs in the Ollama app on your computer, not in a container
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"  # makes the host reachable on Linux too
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface  # embedding model, downloaded once
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_URL: http://api:8000  # service name works as host name inside compose
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf-cache:
